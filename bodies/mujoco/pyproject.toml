# bodies/mujoco -- the MuJoCo body for ubrain: menagerie robots (the Unitree G1
# first, under robots/), sensors, motor primitives and the tick bridge. A SEPARATE
# environment from the brain's on purpose: the brain needs only numpy, this stack
# needs MuJoCo 3.12 and numpy 2.5.x, and the two meet only over the tick bridge.
# Never install this into the brain's environment; `uv sync` here builds its own.
# One environment serves every robot in the pinned menagerie; a second simulator
# would be a sibling folder with its own.
#
# Runtime pins are exact (==) and uv.lock is committed: the body's manifest
# (body/manifest.py) records the versions, so a result computed against one body
# is never mistaken for another's. Encoders (CLIP, ...) are not here:
# they plug into the brain, as ubrain codecs.

[project]
name = "robot-mujoco"
version = "0.10.1"      # one number with body/__init__.py (keyed into the digest; bump both)
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
description = "The MuJoCo body for ubrain: menagerie robots, proprioception, motor primitives, a head camera, the tick bridge"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mujoco==3.12.0",
    "mujoco-menagerie==2026.9.0",
    "numpy==2.5.2",
]

[dependency-groups]
# Tooling only -- never touches a result, so a range is acceptable here.
dev = ["pytest>=8,<9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["body", "robots"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
